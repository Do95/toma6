default: &default
  adapter: postgresql
  encoding: unicode
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 }.to_i + 4 %>
  host: <%= ENV.fetch("DB_HOST", "localhost") %>
  port: <%= ENV.fetch("DB_PORT", 5432) %>
  username: <%= ENV.fetch("DB_USERNAME", ENV["USER"]) %>
  password: <%= ENV["DB_PASSWORD"] %>

development:
  <<: *default
  database: toma6_development

test:
  <<: *default
  database: toma6_test

production:
  <<: *default
  url: <%= ENV["DATABASE_URL"] %>
  database: toma6_production
