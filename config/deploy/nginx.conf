# /etc/nginx/sites-available/toma6  (después: certbot --nginx -d toma6.com -d www.toma6.com)
upstream toma6_puma { server 127.0.0.1:3000; }

server {
  listen 80;
  server_name toma6.com www.toma6.com;
  root /home/deploy/toma6/public;
  client_max_body_size 400M;   # videos

  location ^~ /assets/  { expires 1y; add_header Cache-Control "public, immutable"; try_files $uri =404; }
  location ^~ /uploads/ { expires 30d; add_header Cache-Control "public"; try_files $uri =404; }

  location / {
    try_files $uri @app;
  }

  location @app {
    proxy_pass http://toma6_puma;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 120s;
  }
}
